[workspace]
members = [
    # Protocol
    "nostr",

    # Nostr SDK
    "nostr-sdk",

    # Nostr Database
    "database/nostr-database",
    "database/nostr-database-test-suite",
    "database/nostr-lmdb",
    "database/nostr-memory",
    "database/nostr-ndb",
    "database/nostr-sqlite",

    # Gossip
    "gossip/nostr-gossip",
    "gossip/nostr-gossip-memory",
    "gossip/nostr-gossip-sqlite",
    "gossip/nostr-gossip-test-suite",

    # Signers
    "signer/nostr-browser-signer",
    "signer/nostr-browser-signer-proxy",
    "signer/nostr-connect",

    # Others
    "nostr-blossom",
    "nwc",
]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["Yuki Kishimoto <yukikishimoto@protonmail.com>", "Nostr Dev Kit Developers"]
homepage = "https://nostrdevkit.org"
repository = "https://github.com/nostrdevkit/nostr.git"
license = "MIT"
rust-version = "1.85.0"

[workspace.dependencies]
async-utility = {  git = "https://github.com/yukibtc/async-utility", rev = "b323ae0c1c1424b78bf8bb8832b95e86771f1dee" }
atomic-destructor = { version = "0.3", default-features = false }
base64 = { version = "0.22", default-features = false }
bitcoin_hashes = { version = "1.1", default-features = false }
btreecap = "0.1"
faster-hex = { version = "0.10", default-features = false }
lru = { version = "0.18", default-features = false }
negentropy = { version = "0.5", default-features = false }
nostr = { version = "0.45", path = "./nostr", default-features = false }
nostr-connect = { version = "0.45", path = "./signer/nostr-connect", default-features = false }
nostr-database = { version = "0.45", path = "./database/nostr-database", default-features = false }
nostr-database-test-suite = { path = "./database/nostr-database-test-suite" }
nostr-memory = { version = "0.45", path = "./database/nostr-memory", default-features = false }
nostr-gossip = { version = "0.45", path = "./gossip/nostr-gossip", default-features = false }
nostr-gossip-memory = { version = "0.45", path = "./gossip/nostr-gossip-memory", default-features = false }
nostr-gossip-sqlite = { version = "0.45", path = "./gossip/nostr-gossip-sqlite", default-features = false }
nostr-gossip-test-suite = { path = "./gossip/nostr-gossip-test-suite" }
nostr-lmdb = { version = "0.45", path = "./database/nostr-lmdb", default-features = false }
nostr-ndb = { version = "0.45", path = "./database/nostr-ndb", default-features = false }
nostr-sdk = { version = "0.45", path = "./nostr-sdk", default-features = false }
opaquerr = "0.2"
rand = { version = "0.10", default-features = false }
reqwest = { version = "0.12", default-features = false }
rusqlite = { version = "0.38", default-features = false }
serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false }
tempfile = "3.26"
tokio = { version = ">=1.37", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = "0.3"
universal-time = { version = "0.3", default-features = false }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
