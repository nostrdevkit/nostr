[package]
name = "nostr"
version = "0.45.1"
edition.workspace = true
description = "Rust implementation of the Nostr protocol."
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
rust-version.workspace = true
keywords = ["nostr", "protocol", "no_std"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
std = [
    "alloc",
    "base64?/std",
    "bech32/std",
    "bip39?/std",
    "bitcoin_hashes/std",
    "cbc?/std",
    "chacha20?/std",
    "chacha20poly1305?/std",
    "faster-hex/std",
    "rand?/std",
    "secp256k1/std",
    "serde/std",
    "serde_json/std",
    "unicode-normalization?/std",
    "universal-time/std",
    "url/std",
    "zeroize?/std",
]
alloc = [
    "base64?/alloc",
    "bech32/alloc",
    "bitcoin_hashes/alloc",
    "cbc?/alloc",
    "chacha20poly1305?/alloc",
    "faster-hex/alloc",
    "opaquerr/alloc",
    "rand?/alloc",
    "secp256k1/alloc",
    "serde/alloc",
    "serde_json/alloc",
    "zeroize?/alloc",
]
# Enable random stuff
rand = ["dep:rand"]
# Enable OS Random Number Generator
os-rng = ["rand", "rand/sys_rng"]
# Enable event POW mining using multi-threads
pow-multi-thread = ["std"]
all-nips = [
    "nip04",
    "nip06",
    "nip44",
    "nip46",
    "nip47",
    "nip49",
    "nip59",
    "nip60",
    "nip98",
    "nip117",
    "nip118",
]
nip04 = ["dep:aes", "dep:base64", "dep:cbc", "dep:zeroize"]
nip06 = ["dep:bip39"]
nip44 = ["dep:base64", "dep:chacha20", "dep:zeroize"]
nip46 = ["nip04", "nip44"]
nip47 = ["nip04", "nip44"]
nip49 = ["dep:chacha20poly1305", "dep:scrypt", "dep:unicode-normalization", "dep:zeroize"]
nip59 = ["nip44"]
nip60 = ["nip44"]
nip98 = ["dep:base64"]
nip117 = ["nip44", "rand"]
nip118 = ["nip117"]

[dependencies]
aes = { version = "0.8", optional = true }
base64 = { workspace = true, optional = true }
bech32 = { version = "0.12", default-features = false }
bitcoin_hashes = { workspace = true, default-features = false, features = ["serde"] }
bip39 = { version = "2.1", default-features = false, optional = true }
cbc = { version = "0.1", optional = true }
chacha20 = { version = "0.9", optional = true }
chacha20poly1305 = { version = "0.10", default-features = false, optional = true }
faster-hex.workspace = true
opaquerr.workspace = true
rand = { version = "0.10", default-features = false, optional = true }
scrypt = { version = "0.12", default-features = false, optional = true }
secp256k1 = { version = "0.30", default-features = false }
serde = { workspace = true, default-features = false, features = ["derive"] }
serde_json.workspace = true
unicode-normalization = { version = "0.1", default-features = false, optional = true }
universal-time.workspace = true
url = { version = "2.5", default-features = false, features = ["serde"] }
zeroize = { version = "1.9", default-features = false, optional = true }

[dev-dependencies]
reqwest = { workspace = true, features = ["rustls-tls"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[example]]
name = "keys"
required-features = ["std", "rand", "os-rng"]

[[example]]
name = "nip05"
required-features = ["std"]

[[example]]
name = "nip06"
required-features = ["std", "nip06"]

[[example]]
name = "nip09"
required-features = ["std", "rand", "os-rng"]

[[example]]
name = "nip11"
required-features = ["std"]

[[example]]
name = "nip13"
required-features = ["std", "rand", "os-rng"]

[[example]]
name = "nip19"
required-features = ["std"]

[[example]]
name = "nip57"
required-features = ["std", "rand", "os-rng"]

[[example]]
name = "nip98"
required-features = ["std", "rand", "os-rng", "nip98"]

[[example]]
name = "parser"
required-features = ["std"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(bench)'] }
